name: Release

# Publicar uma versão: git tag v0.3.0 && git push origin v0.3.0
# A imagem só é publicada depois que toda a CI passa e é varrida por vulnerabilidades.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publicar imagem (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Construir (sem publicar) para varrer antes
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ponto:scan
          cache-from: type=gha
      - name: Varredura de vulnerabilidades (bloqueia CRITICAL/HIGH com correção disponível)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ponto:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Publicar com SBOM e proveniência
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
